# Despliegue en Netlify.
# Netlify detecta Next.js y aplica su adaptador oficial automáticamente.
#
# Variables de entorno que hay que crear en Netlify
# (Site configuration → Environment variables):
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_ROLE_KEY
#   CRON_SECRET   (recomendada: protege el proceso nocturno)
#
# Opcionales (fotos de marcación cifradas):
#   FOTOS_CLAVE_CIFRADO    frase secreta de 16+ caracteres. Sin ella las fotos
#                          NO se guardan (se descartan). Si se cambia o se
#                          pierde, las fotos ya guardadas no se pueden abrir.
#   FOTOS_DIAS_RETENCION   días que se conserva cada foto (por defecto 90).

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# El proceso nocturno (cierre automático de jornadas y cierre dominical) lo
# dispara la función programada netlify/functions/autocierre.mjs.
[functions]
  directory = "netlify/functions"
